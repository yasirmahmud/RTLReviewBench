[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rtlreviewbench"
version = "0.1.0"
description = "RTLReviewBench: Evaluating Whether Large Language Models Can Reliably Review RTL for Functional Correctness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
include = ["rtlreviewbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
